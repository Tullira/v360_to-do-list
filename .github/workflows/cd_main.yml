name: Deploy

# Nao dispara em push: o gatilho e a conclusao do workflow "CI" na master
# (origin/HEAD -> origin/master). Assim nada e publicado sem passar pela CI.
on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ master ]

# Dois deploys seguidos nao podem disputar o mesmo servidor. O deploy em
# andamento termina antes do proximo comecar (cancel-in-progress: false).
concurrency:
  group: deploy-production
  cancel-in-progress: false

# O deploy autentica por chave SSH, nao pelo GITHUB_TOKEN: nada aqui precisa
# escrever no repositorio. Sem este bloco o token recebe o padrao do
# repositorio, que pode ser read/write em tudo.
permissions:
  contents: read

env:
  APP_NAME: to-do-list

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    # workflow_run dispara em qualquer conclusao, inclusive failure e
    # cancelled - o filtro de verdade e aqui. O `event == 'push'` descarta as
    # execucoes de CI vindas de pull_request.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Em workflow_run o checkout traz o HEAD da branch padrao por
          # padrao, que pode ja ter avancado - publicaria um commit diferente
          # do que a CI testou. Fixamos o SHA exato da execucao aprovada.
          ref: ${{ github.event.workflow_run.head_sha }}
          # O Dokku precisa do historico completo: o push e um push de git,
          # nao um envio de tarball.
          fetch-depth: 0

      - name: Preparar chave SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
          DOKKU_HOST: ${{ secrets.DOKKU_HOST }}
          DOKKU_HOST_KEY: ${{ secrets.DOKKU_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Sem fallback para ssh-keyscan. Confiar na chave apresentada no
          # momento e trust-on-first-use a CADA execucao, nao so na primeira:
          # quem estiver posicionado na rede do runner se passa pelo servidor
          # Dokku e recebe o push, que leva o codigo-fonte inteiro - e o
          # known_hosts gerado no proprio job validaria a chave falsa.
          if [ -z "$DOKKU_HOST_KEY" ]; then
            echo "::error::Preencha o secret DOKKU_HOST_KEY com a saida de 'ssh-keyscan $DOKKU_HOST' rodada de uma maquina confiavel. E configuracao unica."
            exit 1
          fi
          printf '%s\n' "$DOKKU_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # O ssh ignora em silencio uma linha malformada (ex.: o conteudo de
          # um .pub, que nao tem o host no inicio) ou capturada para outro
          # nome - e o erro so aparece no push, como "Host key verification
          # failed". Falhamos aqui, dizendo o que corrigir.
          if ! ssh-keygen -F "$DOKKU_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::known_hosts nao tem entrada para '$DOKKU_HOST'. Preencha o secret DOKKU_HOST_KEY com a saida de 'ssh-keyscan $DOKKU_HOST' (linha completa, comecando pelo host)."
            exit 1
          fi

      - name: Push para o Dokku
        env:
          DOKKU_HOST: ${{ secrets.DOKKU_HOST }}
          # StrictHostKeyChecking explicito: e o padrao efetivo numa sessao
          # nao interativa, mas deixar implicito esconde que a verificacao
          # depende inteiramente do known_hosts montado no passo anterior.
          GIT_SSH_COMMAND: ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        # Push normal, sem --force: o Dokku so recebe historico que ja esta
        # em master, e master nunca e reescrito. Se um dia o push for
        # rejeitado por nao ser fast-forward, isso e sinal de historico
        # reescrito - investigue em vez de forcar.
        run: git push "dokku@${DOKKU_HOST}:${APP_NAME}" "HEAD:refs/heads/master"
