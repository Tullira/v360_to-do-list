name: CI

# Nenhum job aqui escreve no repositorio. Sem este bloco o GITHUB_TOKEN recebe
# o padrao do repositorio, que em repositorios mais antigos e read/write em
# tudo: qualquer step comprometido (gem maliciosa, action comprometida) ganharia
# escrita no codigo.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      # O --update baixa a ruby-advisory-db do GitHub antes de checar. Sem ele
      # o scan usa a copia embutida na gem bundler-audit, congelada na data de
      # release daquela versao (hoje 0.9.3 no Gemfile.lock): a CI ficaria cega
      # para toda CVE publicada depois. Atualiza o banco de advisories, nao as
      # gems - nenhum comando aqui escreve no Gemfile.lock.
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit check --update
      
  # O nome deste job e o nome do status check exigido na protecao da branch
  # master ("Require status checks to pass before merging"). Renomear aqui sem
  # renomear la faz o GitHub esperar por um check que nunca chega - PR travado
  # - ou, pior, liberar o merge por nao exigir nada.
  test:
    name: test
    runs-on: ubuntu-latest

    # O Postgres da CI e descartavel: usuario/senha fixos aqui, sem secret,
    # porque o servico so existe dentro da rede desta execucao.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      RAILS_ENV: test
      # Variaveis discretas, como no compose.yaml. Nao use DATABASE_URL: o
      # Rails a mescla sobre a config do ambiente atual (ver database.yml).
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME_TEST: to_do_list_test
      # O Cuprite dirige um Chrome de verdade nos specs de sistema. No
      # container o binario e o chromium (ver Dockerfile.dev); no runner do
      # GitHub e o google-chrome instalado no passo abaixo.
      BROWSER_PATH: /usr/bin/google-chrome

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            google-chrome-stable libvips postgresql-client

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1
        with:
          bundler-cache: true

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Build Tailwind CSS
        # app/assets/builds/ nao e versionado. Sem este passo o Propshaft nao
        # acha o "tailwind" do layout e todo spec de sistema quebra.
        run: bin/rails tailwindcss:build

      - name: Run test suite
        run: bundle exec rspec

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b  # v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

