# PostgreSQL. Versions 9.5 and up are supported.
#
# A conexao e configurada por variaveis de ambiente, definidas pelo
# compose.yaml a partir do .env (que nao e versionado). Nenhuma senha
# fica em arquivo versionado.
#
# Nao usamos DATABASE_URL de proposito: o Rails mescla DATABASE_URL sobre a
# config do ambiente atual, entao rodar a suite com ela definida faria o
# ambiente de teste apontar para o banco de desenvolvimento - e o
# db:test:prepare apagaria os dados de dev.
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME_DEVELOPMENT", "to_do_list_development") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("DB_NAME_TEST", "to_do_list_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME_PRODUCTION", "to_do_list_production") %>
